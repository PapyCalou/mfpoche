<!doctype html>
<!--
  MyFinance Poche — application iPhone autonome de MyFinance (version 1.1 du 29/10/2026)
  ------------------------------------------------------------------------------------
  Rôle : noter sur l'iPhone les virements de provisions faits depuis l'application de la banque,
  puis renvoyer au Mac un petit fichier chiffré que MyFinance intègre tout seul.

  Fonctionnement :
  - Le Mac dépose OneDrive › … › Banques › MyFinance › iPhone › MyFinance-mobile.json (chiffré AES-GCM).
  - Cette page l'ouvre (bouton « Ouvrir le fichier »), le déchiffre avec le mot de passe MyFinance
    (PBKDF2-SHA256 600 000 itérations, comme sur le Mac) ou avec Face ID (WebAuthn + extension PRF, iOS 18+).
  - Les virements notés sont gardés chiffrés dans le stockage local de l'iPhone (clé « mf-mobile-queue »).
  - « Envoyer au Mac » crée MyFinance-retour-AAAAMMJJHHMM.json (chiffré) via la feuille de partage iOS
    → « Enregistrer dans Fichiers » › OneDrive › … › MyFinance › iPhone.

  Sécurité : aucune donnée n'est envoyée sur Internet. Le site (GitHub Pages) ne contient que ce code ;
  les chiffres ne quittent jamais l'iPhone autrement que par le fichier retour chiffré que vous enregistrez.
  Face ID : la clé de déchiffrement est elle-même chiffrée par une clé dérivée (HKDF) du secret PRF
  du passkey de l'iPhone ; elle est stockée sous « mf-bio ». Le mot de passe n'est jamais mémorisé.

  Fichiers : index.html (cette page), sw.js (fonctionnement hors réseau), manifest.webmanifest et icônes.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Mise en page : une colonne « talon de chéquier », barre d'onglets en bas ; vert encre bancaire sur papier de sécurité */

  --warn: #a5560b; --warn-soft: #fbecd9; --ok: #1d7a43; --ok-soft: #dcf1e3; --bad: #b42318; --bad-soft: #fde4e1;
  /* Polices système de l'iPhone : rien à télécharger, fonctionne hors réseau */
  --display: "SF Pro Rounded", ui-rounded, -apple-system, "Avenir Next", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1a17; --card: #16241f; --ink: #e3efea; --muted: #94aaa2; --line: #2b3d37;
  --accent: #3fb8a5; --accent-ink: #062520; --accent-soft: #173a34;
  --warn: #f0a74d; --warn-soft: #3a2a14; --ok: #5fcf8c; --ok-soft: #173326; --bad: #f2877b; --bad-soft: #3d1c19; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1a17; --card: #16241f; --ink: #e3efea; --muted: #94aaa2; --line: #2b3d37;
  --accent: #3fb8a5; --accent-ink: #062520; --accent-soft: #173a34;
  --warn: #f0a74d; --warn-soft: #3a2a14; --ok: #5fcf8c; --ok-soft: #173326; --bad: #f2877b; --bad-soft: #3d1c19; color-scheme: dark }
* { box-sizing: border-box }

body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0;
  background-image: repeating-linear-gradient(135deg, transparent 0 11px, color-mix(in srgb, var(--line) 35%, transparent) 11px 12px); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: 110px; display: grid; gap: 14px }

.row { display: flex; gap: 10px; flex-wrap: wrap } .row > * { flex: 1 1 140px }

.list { display: grid } .list > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline } .list > div:first-child { border-top: 0 }
.list .name { min-width: 0; overflow-wrap: anywhere }

.banner.info { background: var(--accent-soft); color: var(--ink) }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-top: 6px }
.tabs button { border: 0; background: transparent; padding: 6px 2px; font-size: .74rem; color: var(--muted); display: grid; gap: 2px; justify-items: center; position: relative }
.tabs button[aria-selected="true"] { color: var(--accent) }

<body>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="eyebrow">MyFinance · iPhone</div><h1>Virements de provisions</h1></div>
    <span id="src-chip" class="chip warn">Exemple</span>
  </header>
  <div id="view"></div>
</div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="tab-month" aria-selected="true" onclick="go('month')"><span class="ico">€</span>Ce mois</button>
  <button role="tab" id="tab-queue" aria-selected="false" onclick="go('queue')"><span class="ico">↗</span>Envoyer<span id="q-badge" class="badge" hidden></span></button>
  <button role="tab" id="tab-accounts" aria-selected="false" onclick="go('accounts')"><span class="ico">≡</span>Comptes</button>
  <button role="tab" id="tab-file" aria-selected="false" onclick="go('file')"><span class="ico">⇩</span>Fichier</button>
</nav>

<script>
// ---------- Données d'exemple (affichées tant qu'aucun fichier n'est ouvert, clairement signalées) ----------
const EXAMPLE = { type: 'myfinance-mobile', generatedAt: '2026-10-29T18:00:00Z', example: true,
  accounts: [
    { id: 'a1', name: 'Compte joint', bank: 'BoursoBank', current: true, liquid: true, balance: 3412.55, num: '12345' },
    { id: 'a2', name: 'LDD Pascal', bank: 'BoursoBank', current: false, liquid: true, balance: 11850, num: '01352' },
    { id: 'a3', name: 'Livret Bourso+', bank: 'BoursoBank', current: false, liquid: true, balance: 8030, num: '04478' }],
  plan: { from: 'a1', to: 'a2', day: 8, total: 830, lines: [{ name: 'Impôts', amount: 120 }, { name: 'Voitures', amount: 125 }, { name: 'Piscine', amount: 200 }, { name: 'Vacances', amount: 185 }, { name: 'Taxe foncière', amount: 200 }] },
  envelopes: [{ name: 'Impôts', monthly: 120, balance: 1320 }, { name: 'Voitures', monthly: 125, balance: 940 }, { name: 'Piscine', monthly: 200, balance: 1600 }, { name: 'Vacances', monthly: 185, balance: 2080 }, { name: 'Taxe foncière', monthly: 200, balance: 1500 }],
  totals: { provisions: 7440, transit: 1660, gapOpen: 0 },
  months: [
    { month: '2026-10', label: 'Octobre 2026', total: 830, done: false, missing: false, pending: 830, envelopes: [{ name: 'Impôts', amount: 120 }, { name: 'Voitures', amount: 125 }, { name: 'Piscine', amount: 200 }, { name: 'Vacances', amount: 185 }, { name: 'Taxe foncière', amount: 200 }], transfers: [] },
    { month: '2026-09', label: 'Septembre 2026', total: 830, done: false, missing: false, pending: 830, envelopes: [], transfers: [] },
    { month: '2026-08', label: 'Août 2026', total: 830, done: true, missing: false, pending: 0, envelopes: [], transfers: [{ date: '2026-08-08', amount: 830, from: 'a1', to: 'a2', reconciled: true }] }],
  transfers: [{ date: '2026-08-08', amount: 830, from: 'a1', to: 'a2', payee: 'VIR Prov 2026-08 LDD', kind: 'feed', provisions: true, reconciled: true }],
  scpis: [{ name: 'Transitions Europe', company: 'Arkéa REIM', parts: 126, value: 25452, invested: 25200 }],
  applied: [] };

// ---------- État ----------
let data = EXAMPLE, envText = null, dek = null, encrypted = false, queue = [], view = 'month', notice = null, monthSel = new Set(), formOpen = false, confirmClear = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const dfr = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const acc = id => (data.accounts || []).find(a => a.id === id);
const accName = id => { const a = acc(id); return a ? a.name : '?'; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

// ---------- Chiffrement (identique à MyFinance sur le Mac) ----------
const b64e = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = str => { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function unwrapWithPassword(wr, pwd) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pwd).normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(wr.salt), iterations: wr.iter || 600000 }, base, { name: 'AES-GCM', length: 256 }, false, ['unwrapKey']);
  return crypto.subtle.unwrapKey('raw', b64d(wr.data), kek, { name: 'AES-GCM', iv: b64d(wr.iv) }, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function decryptWith(key, iv, data) { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(iv) }, key, b64d(data))); }
async function encryptWith(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)); return { iv: b64e(iv), data: b64e(ct) }; }

// ---------- Fichier du Mac ----------
function readPicked(ev) {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadEnvelope(String(rd.result), true);
  rd.readAsText(f);
}
function loadEnvelope(text, fresh) {
  let o;
  try { o = JSON.parse(text); } catch (e) { notice = { kind: 'bad', text: "Ce fichier n'est pas un fichier MyFinance (JSON illisible)." }; render(); return; }
  if (o && o.myfinanceEncrypted === 1 && o.keys && o.keys.pwd) { envText = text; encrypted = true; dek = null; data = null; if (fresh) store.set('mf-mobile-file', text); view = 'file'; outCache = null; notice = { kind: 'info', text: bioInfo() ? 'Fichier chiffré : Face ID ou mot de passe MyFinance.' : 'Fichier chiffré : saisissez votre mot de passe MyFinance.' }; render(); setTimeout(() => { const p = $('pwd'); if (p) p.focus(); }, 50); return; }
  if (o && o.type === 'myfinance-mobile') { envText = text; encrypted = false; dek = null; data = o; if (fresh) store.set('mf-mobile-file', text); afterLoad(); return; }
  notice = { kind: 'bad', text: "Ce n'est pas le fichier MyFinance-mobile.json (dossier OneDrive › MyFinance › iPhone)." }; render();
}
async function unlock(ev) {
  ev.preventDefault();
  const pwd = $('pwd').value; if (!pwd) return;
  const btn = $('unlock-btn'); btn.disabled = true; btn.textContent = 'Vérification…';
  try {
    const o = JSON.parse(envText);
    dek = await unwrapWithPassword(o.keys.pwd, pwd);
    data = JSON.parse(await decryptWith(dek, o.iv, o.data));
    if (data.type !== 'myfinance-mobile') throw new Error('type');
    $('pwd').value = '';
    await afterLoad();
  } catch (e) { notice = { kind: 'bad', text: 'Mot de passe incorrect (ou fichier d\'un autre type).' }; data = null; render(); }
}
async function afterLoad() {
  await loadQueue();
  const applied = new Set(data.applied || []);
  const before = queue.length; queue = queue.filter(it => !applied.has(it.id));
  if (queue.length !== before) await saveQueue();
  notice = before !== queue.length ? { kind: 'ok', text: `${before - queue.length} retour(s) déjà pris en compte par le Mac.` } : null;
  monthSel = new Set((data.months || []).filter(m => !m.done && !m.missing && m.pending > 0).map(m => m.month));
  view = 'month'; render();
}
function lockNow() { dek = null; data = null; queue = []; outCache = null; showFallback = false; view = 'file'; notice = null; render(); }
// Verrouillage automatique après 5 minutes en arrière-plan (téléphone posé, autre application…)
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 5 * 60000 && dek && encrypted) {
    lockNow(); notice = { kind: 'info', text: 'Verrouillé après 5 minutes en arrière-plan.' }; render();
    if (bioInfo()) unlockBio(true);
  }
});
// Tout effacer de cet iPhone (fichier en cache, liste à envoyer, Face ID) — en deux touches
let confirmForget = false;
function forgetAll() {
  if (!confirmForget) { confirmForget = true; render(); return; }
  ['mf-mobile-file', 'mf-mobile-queue', BIO_KEY].forEach(k => store.del(k));
  location.reload();
}

// ---------- Face ID / Touch ID (WebAuthn + extension PRF, iOS 18 ou plus récent) ----------
// Principe : un passkey propre à cet iPhone fournit, après Face ID, un secret (PRF) stable.
// HKDF(secret) → clé AES qui chiffre la clé de données (DEK). Rien n'est envoyé nulle part.
const BIO_KEY = 'mf-bio';
const bioInfo = () => { try { return JSON.parse(store.get(BIO_KEY) || 'null'); } catch (e) { return null; } };
let bioCapable = false, bioBusy = false;
async function checkBio() {
  try { bioCapable = !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch (e) { bioCapable = false; }
}
async function prfKek(first, salt) {
  const base = await crypto.subtle.importKey('raw', first, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: new TextEncoder().encode('MyFinance Poche · Face ID') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function prfGet(credId, prfSalt) {
  const cred = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const r = cred && cred.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error('noprf');
  return new Uint8Array(r.results.first);
}
async function enableBio() {
  if (!dek || bioBusy) return;
  bioBusy = true; render();
  try {
    const prfSalt = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'MyFinance Poche' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'MyFinance Poche', displayName: 'MyFinance Poche' },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
    const credId = new Uint8Array(cred.rawId);
    const ext = cred.getClientExtensionResults().prf || {};
    let first = ext.results && ext.results.first ? new Uint8Array(ext.results.first) : null;
    if (!first) { if (ext.enabled === false) throw new Error('noprf'); first = await prfGet(credId, prfSalt); }
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const kek = await prfKek(first, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, await crypto.subtle.exportKey('raw', dek));
    store.set(BIO_KEY, JSON.stringify({ v: 1, credId: b64e(credId), prfSalt: b64e(prfSalt), salt: b64e(salt), iv: b64e(iv), data: b64e(ct), created: new Date().toISOString() }));
    if (!bioInfo()) throw new Error('stockage');
    notice = { kind: 'ok', text: 'Face ID activé sur cet iPhone. Le mot de passe reste possible si Face ID échoue.' };
  } catch (e) {
    const n = e && e.name, m = e && e.message;
    notice = n === 'NotAllowedError' ? { kind: 'info', text: 'Activation de Face ID annulée.' }
      : m === 'noprf' ? { kind: 'bad', text: "Cet iPhone ne permet pas Face ID pour une application web (il faut iOS 18 ou plus récent, et le trousseau iCloud activé). Le mot de passe reste utilisé." }
      : { kind: 'bad', text: 'Activation de Face ID impossible : ' + (m || n || e) };
  }
  bioBusy = false; render();
}
async function unlockBio(silent) {
  const b = bioInfo(); if (!b || !envText || bioBusy) return;
  bioBusy = true; if (!silent) render();
  try {
    const first = await prfGet(b64d(b.credId), b64d(b.prfSalt));
    const kek = await prfKek(first, b64d(b.salt));
    const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(b.iv) }, kek, b64d(b.data));
    const key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    const o = JSON.parse(envText);
    const d = JSON.parse(await decryptWith(key, o.iv, o.data));
    if (d.type !== 'myfinance-mobile') throw new Error('type');
    dek = key; data = d; bioBusy = false;
    await afterLoad();
  } catch (e) {
    bioBusy = false;
    const n = e && e.name;
    if (silent && n === 'NotAllowedError') { render(); return; }
    notice = n === 'NotAllowedError' ? { kind: 'info', text: 'Face ID annulé : touchez « Déverrouiller avec Face ID » pour réessayer, ou saisissez le mot de passe.' }
      : n === 'OperationError' ? { kind: 'bad', text: "Face ID ne déverrouille plus ce fichier (mot de passe changé sur le Mac ?). Saisissez le mot de passe, puis réactivez Face ID dans l'onglet « Fichier »." }
      : { kind: 'bad', text: 'Face ID indisponible pour le moment : saisissez le mot de passe.' };
    render();
  }
}
function disableBio() { store.del(BIO_KEY); notice = { kind: 'ok', text: 'Face ID désactivé sur cet iPhone.' }; render(); }
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const FACE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg>';

// ---------- File d'attente des retours (chiffrée sur l'iPhone) ----------
async function loadQueue() {
  queue = [];
  const raw = store.get('mf-mobile-queue'); if (!raw) return;
  try {
    const o = JSON.parse(raw);
    if (o.iv && dek) queue = JSON.parse(await decryptWith(dek, o.iv, o.data));
    else if (Array.isArray(o.items) && !encrypted) queue = o.items;
  } catch (e) { queue = []; }
}
async function saveQueue() {
  if (encrypted && dek) store.set('mf-mobile-queue', JSON.stringify(await encryptWith(dek, JSON.stringify(queue))));
  else if (!encrypted) store.set('mf-mobile-queue', JSON.stringify({ items: queue }));
}
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function exampleGuard() { if (data && data.example) { notice = { kind: 'info', text: "Exemple : ouvrez d'abord votre fichier MyFinance (onglet « Fichier »)." }; formOpen = false; render(); return true; } return false; }
async function addTransfer(ev) {
  ev.preventDefault();
  if (exampleGuard()) return;
  const amount = Number(String($('t-amount').value).replace(/\s/g, '').replace(',', '.'));
  const it = { id: newId(), type: 'transfer', date: $('t-date').value, amount, from: $('t-from').value, to: $('t-to').value, months: [...monthSel], note: $('t-note').value.trim(), createdAt: new Date().toISOString() };
  if (!(amount > 0) || !it.date || !it.from || !it.to || it.from === it.to) { notice = { kind: 'bad', text: 'Vérifiez le montant, la date et les deux comptes (différents).' }; render(); return; }
  queue.push(it); await saveQueue();
  formOpen = false; notice = { kind: 'ok', text: `Virement de ${eur(amount)} noté. Pensez à l'envoyer au Mac (onglet « Envoyer »).` };
  render();
}
async function addRecordMonth(m) { if (exampleGuard()) return; queue.push({ id: newId(), type: 'recordMonth', month: m, createdAt: new Date().toISOString() }); await saveQueue(); notice = { kind: 'ok', text: 'Provisions du mois notées : envoyez-les au Mac.' }; render(); }
async function removeItem(id) { queue = queue.filter(i => i.id !== id); await saveQueue(); render(); }
async function clearQueue() { queue = []; confirmClear = false; await saveQueue(); notice = { kind: 'ok', text: 'Liste vidée.' }; render(); }
// Le fichier retour est préparé à l'avance (dès l'ouverture de l'onglet « Envoyer ») pour que
// la feuille de partage s'ouvre immédiatement au toucher (iOS exige un geste récent de l'utilisateur).
let outCache = null, showFallback = false;
const qSig = () => queue.map(i => i.id).join(',');
async function buildOut() {
  const sig = qSig();
  if (outCache && outCache.sig === sig) return outCache;
  const payload = { type: 'myfinance-mobile-return', items: queue, createdAt: new Date().toISOString() };
  const text = encrypted && dek ? JSON.stringify(Object.assign({ myfinanceMobileReturn: 1 }, await encryptWith(dek, JSON.stringify(payload)))) : JSON.stringify(payload);
  const name = 'MyFinance-retour-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.json';
  outCache = { sig, name, text };
  return outCache;
}
async function sendToMac() {
  if (!queue.length) return;
  const out = await buildOut();
  let file = null;
  try { file = new File([out.text], out.name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      notice = { kind: 'ok', text: "Fichier transmis. S'il est bien dans OneDrive › … › MyFinance › iPhone, le Mac l'intégrera dans les 2 minutes (MyFinance ouvert)." };
      confirmClear = true; render(); return;
    } catch (e) {
      if (e && e.name === 'AbortError') { notice = { kind: 'info', text: 'Envoi annulé.' }; render(); return; }
    }
  }
  // Repli : téléchargement du fichier (Fichiers › Téléchargements) et texte à copier
  try {
    const url = URL.createObjectURL(new Blob([out.text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = out.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {}
  showFallback = true; confirmClear = true;
  notice = { kind: 'info', text: 'Fichier « ' + out.name + ' » téléchargé (app Fichiers › Téléchargements) : déplacez-le dans OneDrive › … › MyFinance › iPhone. À défaut, copiez le texte ci-dessous dans un fichier de ce nom.' };
  render();
  const t = $('fallback'); if (t) t.value = out.text;
}
async function copyFallback() { const t = $('fallback'); if (!t) return; try { await navigator.clipboard.writeText(t.value); notice = { kind: 'ok', text: 'Copié.' }; } catch (e) { t.select(); } render(); }

// ---------- Affichage ----------
function go(v) { view = v; formOpen = false; confirmForget = false; render(); if (v === 'queue' && queue.length && data && !data.example) buildOut().catch(() => {}); }
function setSel(m, on) { on ? monthSel.add(m) : monthSel.delete(m); const t = $('t-amount'); if (t) { t.value = selTotal() || ''; renderTotal(); } else render(); }
function selTotal() { return (data.months || []).filter(m => monthSel.has(m.month)).reduce((s, m) => s + (m.pending || 0), 0); }
function renderTotal() { const e = $('sel-total'); if (e) e.textContent = eur(selTotal()); }
function accountOptions(sel, filter) { return (data.accounts || []).filter(filter).map(a => `<option value="${esc(a.id)}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)} — ${esc(a.bank)}${a.num ? ' …' + esc(a.num) : ''}</option>`).join(''); }

// Formulaire de virement (montant pré-rempli avec le total des mois cochés ; vide si aucun mois)
function openForm() { formOpen = true; render(); setTimeout(() => { const a = $('t-amount'); if (a) a.focus(); }, 50); }
function transferForm(p) { return `<form class="panel" style="border-style:dashed" onsubmit="addTransfer(event)">
      <div class="row"><label class="field">Date du virement<input id="t-date" type="date" value="${today()}" required></label>
      <label class="field">Montant (€)<input id="t-amount" type="text" inputmode="decimal" value="${selTotal() || ''}" required></label></div>
      <label class="field">Depuis<select id="t-from">${accountOptions(p.from, a => a.current)}</select></label>
      <label class="field">Vers<select id="t-to">${accountOptions(p.to, a => !a.current && !a.debt)}</select></label>
      <label class="field">Note (facultatif)<input id="t-note" type="text" placeholder="ex. septembre + octobre"></label>
      <div class="row"><button type="button" class="btn-ghost" onclick="formOpen=false;render()">Annuler</button><button type="submit" class="btn-primary">Noter ce virement</button></div>
    </form>`; }
function viewMonth() {
  if (!data) return viewFile();
  const months = data.months || [], todo = months.filter(m => !m.done && !m.missing && m.pending > 0), missing = months.filter(m => m.missing);
  const pend = todo.reduce((s, m) => s + m.pending, 0), p = data.plan || {};
  const queued = queue.filter(i => i.type === 'transfer');
  return `
  <section class="stub" aria-label="Reste à virer">
    <div class="main">
      <span class="eyebrow">Reste à virer vers l'épargne</span>
      <span class="big">${eur(pend)}</span>
      <span class="route">${esc(accName(p.from))} <span class="arrow">→</span> ${esc(accName(p.to))}</span>
      <span class="small muted">Plan : ${eur(p.total)} par mois, le ${esc(p.day)}${queued.length ? ` · ${queued.length} virement(s) noté(s), à envoyer` : ''}</span>
    </div>
    <div class="tear"><span class="eyebrow">Mois</span><span class="big" style="font-size:1.5rem">${todo.length}</span><span class="small muted">en attente</span></div>
  </section>
  ${missing.map(m => `<div class="banner bad">⚠ ${esc(m.label)} : aucune provision enregistrée. <button class="btn-ghost" style="padding:6px 10px;margin-left:6px" onclick="addRecordMonth('${esc(m.month)}')">Enregistrer les provisions</button></div>`).join('')}
  ${todo.length ? `<div class="panel">
    <div class="top"><h2>J'ai fait le virement</h2><span class="small muted">Total coché <b class="money" id="sel-total">${eur(selTotal())}</b></span></div>
    <div>${todo.map(m => `<div class="month"><input type="checkbox" id="m-${esc(m.month)}" ${monthSel.has(m.month) ? 'checked' : ''} onchange="setSel('${esc(m.month)}', this.checked)" aria-label="${esc(m.label)}">
      <label for="m-${esc(m.month)}"><b>${esc(m.label)}</b></label><span class="money">${eur(m.pending)}</span>
      ${(m.envelopes || []).length ? `<span class="env">${m.envelopes.map(e => `${esc(e.name)} ${eur(e.amount)}`).join(' · ')}</span>` : ''}</div>`).join('')}</div>
    ${formOpen ? transferForm(p) : `<button class="btn-primary" onclick="openForm()">${monthSel.size ? `J'ai fait le virement de ${eur(selTotal())}` : 'Noter un virement (sans mois)'}</button>`}
  </div>` : `<div class="banner ok">✓ Tous les mois sont déjà marqués « virement fait » sur le Mac. Vous pouvez quand même noter un virement ci-dessous.</div>
  ${formOpen ? transferForm(p) : `<button class="btn-primary" onclick="openForm()">Noter un virement</button>`}`}
  <div class="panel"><h2>Mois par mois</h2><div class="list">${months.map(m => `<div><span class="name"><b>${esc(m.label)}</b>${(m.transfers || []).length ? `<span class="small muted"> · ${m.transfers.map(t => `${dfr(t.date)} ${esc(accName(t.from))} → ${esc(accName(t.to))}`).join(' · ')}</span>` : ''}</span>
    <span>${m.missing ? '<span class="chip bad">manquant</span>' : m.done ? '<span class="chip ok">✓ viré</span>' : `<span class="chip warn">${eur(m.pending)} à virer</span>`}</span></div>`).join('') || '<div class="muted">Aucun mois.</div>'}</div></div>
  <div class="panel"><h2>Derniers virements</h2><div class="list">${(data.transfers || []).slice(0, 12).map(t => `<div><span class="name">${dfr(t.date)} · ${esc(accName(t.from))} → ${esc(accName(t.to))}${t.provisions ? ' <span class="chip info">provisions</span>' : ''}</span><span class="money">${eur(t.amount)}</span></div>`).join('') || '<div class="muted">Aucun virement récent.</div>'}</div></div>`;
}
function viewQueue() {
  if (!data) return viewFile();
  return `<div class="panel"><div class="top"><h2>À envoyer au Mac</h2><span class="chip ${queue.length ? 'warn' : 'ok'}">${queue.length} élément(s)</span></div>
    <div class="list">${queue.map(i => `<div><span class="name">${i.type === 'transfer' ? `<b>${eur(i.amount)}</b> le ${dfr(i.date)}<br><span class="small muted">${esc(accName(i.from))} → ${esc(accName(i.to))}${i.months && i.months.length ? ' · ' + i.months.map(esc).join(', ') : ''}${i.note ? ' · ' + esc(i.note) : ''}</span>` : `Provisions de <b>${esc(i.month)}</b> à enregistrer`}</span>
      <button class="btn-ghost btn-danger" style="padding:6px 10px" onclick="removeItem('${esc(i.id)}')" aria-label="Retirer">Retirer</button></div>`).join('') || '<div class="muted">Rien à envoyer. Notez un virement dans « Ce mois ».</div>'}</div>
    <button class="btn-primary" onclick="sendToMac()" ${queue.length ? '' : 'disabled'}>Envoyer au Mac (fichier pour OneDrive)</button>
    <p class="small muted">Dans la feuille de partage : « Enregistrer dans Fichiers » › Parcourir › OneDrive › … › Banques › MyFinance › <b>iPhone</b>. Le Mac lit ce dossier toutes les 2 minutes quand MyFinance est ouvert.</p>
    ${confirmClear && queue.length ? `<div class="banner info">Le fichier est bien dans OneDrive ? <button style="padding:6px 10px;margin-left:6px" onclick="clearQueue()">Oui, vider la liste</button></div>` : ''}
    ${showFallback ? `<textarea id="fallback" class="code" readonly>${esc(outCache ? outCache.text : '')}</textarea>
    <button onclick="copyFallback()">Copier le texte</button>` : ''}

}
function viewAccounts() {
  if (!data) return viewFile();
  const byBank = {};
  (data.accounts || []).forEach(a => { (byBank[a.bank] = byBank[a.bank] || []).push(a); });
  const t = data.totals || {};
  return `<div class="panel"><div class="top"><h2>Enveloppes</h2><span class="money"><b>${eur(t.provisions)}</b></span></div>
    <div class="list">${(data.envelopes || []).map(e => `<div><span class="name">${esc(e.name)}<span class="small muted"> · ${eur(e.monthly)}/mois</span></span><span class="money" style="color:${e.balance < 0 ? 'var(--bad)' : 'inherit'}">${eur(e.balance)}</span></div>`).join('')}</div>
    ${t.transit ? `<p class="small muted">Dont ${eur(t.transit)} pas encore virés sur l'épargne.</p>` : ''}</div>
    <div class="panel"><h2>Comptes</h2>${Object.keys(byBank).sort().map(b => `<div><div class="eyebrow">${esc(b)}</div><div class="list">${byBank[b].map(a => `<div><span class="name">${esc(a.name)}${a.num ? `<span class="small muted"> …${esc(a.num)}</span>` : ''}</span><span class="money" style="color:${a.balance < 0 ? 'var(--bad)' : 'inherit'}">${eur(a.balance)}</span></div>`).join('')}</div></div>`).join('')}</div>
    ${(data.scpis || []).length ? `<div class="panel"><h2>SCPI</h2><div class="list">${data.scpis.map(s => `<div><span class="name">${esc(s.name)}<span class="small muted"> · ${s.parts} parts</span></span><span class="money" style="color:${s.value < s.invested ? 'var(--bad)' : s.value > s.invested ? 'var(--ok)' : 'inherit'}">${eur(s.value)}</span></div>`).join('')}</div></div>` : ''}`;
}
function viewFile() {
  const cached = store.get('mf-mobile-file');
  let when = '';
  try { const o = JSON.parse(cached || envText || '{}'); when = o.savedAt || o.generatedAt || ''; } catch (e) {}
  return `<div class="panel">
    <h2>Fichier du Mac</h2>
    <p class="small">Le Mac dépose <code>MyFinance-mobile.json</code> dans OneDrive › … › Banques › MyFinance › <b>iPhone</b>. Ouvrez-le ici (app Fichiers › OneDrive).</p>
    <label class="btn ${encrypted && envText && !dek ? '' : 'btn-primary'}" for="pick">${envText ? 'Ouvrir un fichier plus récent' : 'Ouvrir le fichier'}<input id="pick" type="file" onchange="readPicked(event)" hidden></label>
    ${when ? `<p class="small muted">Dernier fichier ouvert : préparé le ${dfr(when.slice(0, 10))} à ${when.slice(11, 16)}.</p>` : ''}
  </div>
  ${!isStandalone() ? `<div class="banner info"><b>Installer sur l'écran d'accueil :</b> dans Safari, touchez <b>Partager</b> (carré avec flèche) › <b>Sur l'écran d'accueil</b> › Ajouter. Ensuite, ouvrez toujours MyFinance Poche par son icône (Safari et l'icône ne partagent pas leurs données).</div>` : ''}
  ${encrypted && envText && !dek && bioInfo() ? `<button class="btn-primary bio-btn" onclick="unlockBio(false)" ${bioBusy ? 'disabled' : ''}>${FACE_SVG}${bioBusy ? 'Face ID…' : 'Déverrouiller avec Face ID'}</button>` : ''}
  ${encrypted && envText && !dek ? `<form class="panel lock" onsubmit="unlock(event)">
    <h2>Mot de passe MyFinance</h2>
    <input type="text" name="username" value="MyFinance" autocomplete="username" hidden>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe">
    <button id="unlock-btn" class="${bioInfo() ? '' : 'btn-primary'}" type="submit">Déverrouiller avec le mot de passe</button>
    <p class="small muted">Le mot de passe reste sur ce téléphone, le temps du calcul. Rien n'est envoyé nulle part.</p>
  </form>` : ''}
  ${data && !data.example && encrypted && dek ? `<div class="panel">
    <h2>Face ID</h2>
    ${bioInfo() ? `<p class="small">Activé sur cet iPhone : à l'ouverture, Face ID suffit. Le mot de passe reste utilisable.</p><button class="btn-ghost" onclick="disableBio()">Désactiver Face ID</button>`
      : bioCapable ? `<p class="small">Évite de taper le mot de passe à chaque ouverture. iOS vous proposera d'enregistrer un « identifiant » (passkey) pour ce site : acceptez.</p><button class="btn-primary bio-btn" onclick="enableBio()" ${bioBusy ? 'disabled' : ''}>${FACE_SVG}Activer Face ID sur cet iPhone</button>`
      : `<p class="small muted">Face ID n'est pas disponible ici (il faut l'application installée sur l'écran d'accueil d'un iPhone sous iOS 18 ou plus récent).</p>`}
  </div>` : ''}
  ${data && !data.example ? `<button onclick="lockNow()">Verrouiller maintenant</button>` : ''}
  <div class="panel small muted"><b style="color:var(--ink)">Comment ça marche</b>
    <ol style="margin:0;padding-left:1.2rem;display:grid;gap:4px">
      <li>Le Mac écrit le fichier (MyFinance ouvert : automatiquement, ou bouton « 📱 Mettre à jour l'iPhone »).</li>
      <li>Ici, « Ce mois » : cochez les mois virés, puis « J'ai fait le virement » (ou « Noter un virement » si tout est déjà coché sur le Mac).</li>
      <li>« Envoyer » : enregistrez le fichier retour dans le même dossier OneDrive.</li>
      <li>Le Mac l'intègre : la case « Virement fait » du mois se coche.</li>
    </ol>
    <p style="margin:6px 0 0">Aucune donnée n'est envoyée sur Internet : tout reste sur cet iPhone et dans votre OneDrive. Verrouillage automatique après 5 minutes en arrière-plan.</p></div>
  ${store.get('mf-mobile-file') || store.get('mf-mobile-queue') || bioInfo() ? (confirmForget
    ? `<div class="banner bad">Effacer de cet iPhone le fichier, Face ID et la liste à envoyer${queue.length ? ` (<b>${queue.length} élément(s) non envoyé(s)</b>)` : ''} ? <div class="row" style="margin-top:8px"><button class="btn-ghost" onclick="confirmForget=false;render()">Annuler</button><button class="btn-danger" onclick="forgetAll()">Oui, tout effacer</button></div></div>`
    : `<button class="btn-ghost btn-danger" onclick="forgetAll()">Effacer mes données de cet iPhone</button>`) : ''}
  <p class="version">MyFinance Poche · version 1.1 du 29/10/2026</p>`;
}
function render() {
  const chip = $('src-chip');
  if (data && data.example) { chip.className = 'chip warn'; chip.textContent = 'Exemple'; }
  else if (data) { chip.className = 'chip ok'; chip.textContent = 'Données du ' + dfr((data.generatedAt || '').slice(0, 10)); }
  else { chip.className = 'chip info'; chip.textContent = encrypted ? 'Verrouillé' : 'Aucun fichier'; }
  ['month', 'queue', 'accounts', 'file'].forEach(v => $('tab-' + v).setAttribute('aria-selected', String(v === view)));
  const qb = $('q-badge'); qb.hidden = !queue.length; qb.textContent = queue.length;
  const body = view === 'queue' ? viewQueue() : view === 'accounts' ? viewAccounts() : view === 'file' ? viewFile() : viewMonth();
  $('view').innerHTML = (data && data.example ? `<div class="banner example">Exemple : ces chiffres sont fictifs. Ouvrez votre fichier dans l'onglet « Fichier ».</div>` : '')
    + (notice ? `<div class="banner ${notice.kind}" role="status">${esc(notice.text)}</div>` : '') + body;
}

// ---------- Démarrage ----------
(function start() {
  monthSel = new Set(EXAMPLE.months.filter(m => !m.done && !m.missing).map(m => m.month));
  const cached = store.get('mf-mobile-file');
  if (cached) loadEnvelope(cached, false); else render();
  checkBio().then(() => { render(); if (cached && encrypted && !dek && bioInfo() && isStandalone()) unlockBio(true); });
  // Fonctionnement hors réseau : le service worker garde une copie de l'application sur l'iPhone
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
